version: "3.9"

services:
  dashboard:
    build: .
    container_name: node-dashboard
    command: ["npm", "run", "dev"]
    environment:
      - PORT=8088
      - HOSTNAMES_FILE=/data/hostnames.json
      - APP_VERSION=1.1.0
    ports:
      - "8080:8088"
    volumes:
      - ./:/app
      - dashboard_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/fridge:/home/fridge
    restart: unless-stopped

volumes:
  dashboard_data:
