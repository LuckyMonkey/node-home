version: "3.9"

services:
  homepage:
    build: .
    container_name: node-home
    command: ["node", "--watch", "index.js"]
    environment:
      - PORT=8088
      - HOSTNAMES_FILE=/data/hostnames.json
      - APP_VERSION=1.1.0
    ports:
      - "8080:8088"
    volumes:
      - ./:/app
      - node_home_modules:/app/node_modules
      - node_home_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/fridge:/home/fridge
    restart: unless-stopped

volumes:
  node_home_data:
  node_home_modules:
