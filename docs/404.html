<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge.Run Route Bridge</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: dark;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: #0b1020;
      color: #eef2ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top right, rgba(57, 102, 255, 0.28), transparent 35%),
        linear-gradient(180deg, #0b1020, #121931);
    }
    main {
      padding: 24px;
      text-align: center;
      max-width: 42rem;
    }
    a {
      color: #a5c3ff;
    }
  </style>
</head>
<body>
  <main>
    <p id="status">Checking route…</p>
    <p><a id="fallback" href="/">Return home</a></p>
  </main>
  <script>
    (() => {
      const bridgeOrigin = 'https://proc-muslim-situations-mit.trycloudflare.com';
      const { pathname, search } = window.location;
      const fallback = document.getElementById('fallback');
      const status = document.getElementById('status');

      let target = '';

      if (pathname === '/file' || pathname === '/file/' || pathname === '/file.html') {
        target = `${bridgeOrigin}/file${search}`;
      } else if (pathname.startsWith('/file/')) {
        target = `${bridgeOrigin}${pathname}${search}`;
      } else if (pathname.startsWith('/f/')) {
        target = `${bridgeOrigin}${pathname}${search}`;
      }

      if (!target) {
        status.textContent = 'Route not found.';
        fallback.href = '/links.html';
        fallback.textContent = 'Open access portal';
        return;
      }

      status.textContent = 'Redirecting to live fridge share…';
      fallback.href = target;
      fallback.textContent = 'Open share manually';
      window.location.replace(target);
    })();
  </script>
</body>
</html>
