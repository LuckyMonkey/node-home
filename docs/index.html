<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Warning</title>
  <meta name="theme-color" content="#080b10">
  <style>
    :root { --bg:#080b10; --text:#e8edf5; --accent:#b70f1b; --muted:#9aa6bb; --panel:rgba(7,12,20,.82); --border:rgba(255,255,255,.24); }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans","Segoe UI",Roboto,sans-serif; }
    .wall { position:fixed; inset:0; display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); gap:8px; padding:8px; background:linear-gradient(165deg,rgba(5,10,18,.9),rgba(10,14,24,.72)),radial-gradient(140% 70% at 50% -10%,rgba(150,10,23,.25),transparent 60%); }
    .tile { position:relative; border:1px solid rgba(255,255,255,.08); overflow:hidden; border-radius:8px; background:#0e1522; min-height:180px; }
    .tile video { width:100%; height:100%; object-fit:cover; opacity:.48; filter:saturate(.85) contrast(1.05) brightness(.68); transform:scale(1.02); }
    .tile::after { content:""; position:absolute; inset:0; background:linear-gradient(to bottom,rgba(15,26,42,.1),rgba(4,7,12,.55)); pointer-events:none; }
    .scanline { position:fixed; inset:0; pointer-events:none; background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0px,rgba(255,255,255,.05) 1px,transparent 2px,transparent 5px); opacity:.12; mix-blend-mode:soft-light; }
    .center-wrap { position:fixed; inset:0; display:grid; place-items:center; padding:20px; }
    .panel { width:min(980px,94vw); background:var(--panel); border:1px solid var(--border); border-radius:14px; backdrop-filter:blur(8px); box-shadow:0 24px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18); padding:clamp(20px,4vw,46px); text-align:center; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; letter-spacing:.18em; font-size:clamp(10px,1.1vw,13px); text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:16px; }
    .dot { width:8px; height:8px; border-radius:999px; background:var(--accent); box-shadow:0 0 12px rgba(183,15,27,.9); animation:pulse 1.7s infinite; }
    h1 { margin:0; color:#f4f7fb; text-transform:uppercase; letter-spacing:.065em; line-height:1.32; font-size:clamp(19px,2vw,31px); font-weight:700; text-wrap:balance; }
    .bar { width:min(220px,42vw); height:3px; margin:22px auto 0; background:linear-gradient(to right,transparent,var(--accent),transparent); opacity:.9; }
    .cta { margin:16px 0 0; }
    .cta a { display:inline-block; padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,.35); color:#e8edf5; text-decoration:none; font-weight:600; letter-spacing:.04em; text-transform:uppercase; font-size:12px; }
    @keyframes pulse { 0%,100%{opacity:.4;transform:scale(.9)} 50%{opacity:1;transform:scale(1.05)} }
    @media (max-width:1080px){ .wall{grid-template-columns:repeat(4,minmax(100px,1fr));} }
    @media (max-width:680px){ .wall{grid-template-columns:repeat(3,minmax(80px,1fr)); gap:6px; padding:6px;} .tile{border-radius:6px; min-height:135px;} .panel{border-radius:12px;} }
  </style>
</head>
<body>
  <section class="wall" id="videoWall" aria-hidden="true"></section>
  <div class="scanline" aria-hidden="true"></div>
  <main class="center-wrap">
    <section class="panel" role="alert" aria-live="assertive">
      <p class="eyebrow"><span class="dot"></span>Restricted Infrastructure Notice</p>
      <h1>WARNING THE NODE YOU ARE ATTEMPTING TO ACCESS IS THE PROPERTY OF FRIDGE.RUN. UNAUTHORIZED ACCESS BEYOND THIS POINT IS STRICTLY PROHIBITED.</h1>
      <div class="bar" aria-hidden="true"></div>
      <p class="cta"><a href="./links.html">Authorized Access Portal</a></p>
    </section>
  </main>
  <script>
    (() => {
      const sources = ['./media/warning-wall/IMG_8065.mp4','./media/warning-wall/IMG_8066.mp4','./media/warning-wall/IMG_8067.mp4'];
      const wall = document.getElementById('videoWall');
      const count = window.matchMedia('(max-width: 680px)').matches ? 18 : 30;
      for (let i = 0; i < count; i += 1) {
        const tile = document.createElement('article');
        tile.className = 'tile';
        const video = document.createElement('video');
        video.src = sources[i % sources.length];
        video.autoplay = true; video.muted = true; video.loop = true; video.playsInline = true; video.preload = 'metadata';
        video.defaultPlaybackRate = 0.85 + ((i % 5) * 0.05);
        video.playbackRate = video.defaultPlaybackRate;
        video.addEventListener('loadedmetadata', () => {
          if (Number.isFinite(video.duration) && video.duration > 0.2) {
            const offset = ((i * 1.17) % (video.duration - 0.1));
            video.currentTime = Math.max(0, offset);
          }
          video.play().catch(() => {});
        }, { once: true });
        tile.appendChild(video);
        wall.appendChild(tile);
      }
    })();
  </script>
</body>
</html>
