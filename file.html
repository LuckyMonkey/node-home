<!doctype html>
<!-- fridge-share-pages-bridge -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge.Run Share Bridge</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: dark;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: #0b1020;
      color: #eef2ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top right, rgba(57, 102, 255, 0.28), transparent 35%),
        linear-gradient(180deg, #0b1020, #121931);
    }
    main {
      padding: 24px;
      text-align: center;
      max-width: 42rem;
    }
    a {
      color: #a5c3ff;
    }
  </style>
</head>
<body>
  <main>
    <p id="status">Redirecting to live fridge share…</p>
    <p><a id="fallback" href="/">Return home</a></p>
  </main>
  <script>
    (() => {
      const bridgeOrigin = 'https://proc-muslim-situations-mit.trycloudflare.com';
      const fallback = document.getElementById('fallback');
      const status = document.getElementById('status');
      const rawQuery = window.location.search || '';
      const params = new URLSearchParams(rawQuery);
      const keyedSlug = params.get('slug') || params.get('id') || params.get('file') || '';
      const directQuery = rawQuery.startsWith('?') ? rawQuery.slice(1) : '';
      const slug = keyedSlug || directQuery;

      if (!slug) {
        status.textContent = 'No file slug was provided.';
        fallback.href = '/links.html';
        fallback.textContent = 'Open access portal';
        return;
      }

      const target = keyedSlug
        ? `${bridgeOrigin}/file?${encodeURIComponent(keyedSlug)}`
        : `${bridgeOrigin}/file${rawQuery}`;

      fallback.href = target;
      fallback.textContent = 'Open share manually';
      window.location.replace(target);
    })();
  </script>
</body>
</html>
