  <!-- SHORT-LINK SHIM. Runs before anything else, so a share link never pays for
       the video wall. This site is static (GitHub Pages): it only recognises the
       SHAPE of a code - fridge.run?l=dN7 - and hands it to go.fridge.run, which
       holds the table and the session. -->
  <script>
  (function () {
    var m = /[?&]([lf])=([23456789abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ]{3})(?:&|$)/.exec(location.search)
         || /[?&](a)=([23456789abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ]{5})(?:&|$)/.exec(location.search);   // automated link: portal first
    if (m) { location.replace('https://go.fridge.run/?' + m[1] + '=' + m[2]); }
    // One-time drop link: a page that takes one file, then evaporates.
    var d = /[?&]d=([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.search);
    if (d) { location.replace('https://go.fridge.run/drop/' + d[1]); }
  })();
  </script>

  <style>
    html, body { height: 100%; }
    body { display: grid; place-items: center; padding: 20px 16px; overflow-x: hidden; background: #15161a; }

    /* ---- the wall ---------------------------------------------------------------
       3x3 tiles, each the shape of the screen, drawn larger than the screen and
       drifting slowly (Ken Burns) - so it feels like a bigger wall than the nine
       videos it actually decodes. */
    .wall { position: fixed; inset: -9%; z-index: 0; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 4px;
      background: #0d0e11; will-change: transform; animation: drift 80s ease-in-out infinite alternate; }
    .wall .tile { position: relative; overflow: hidden; background: #0d0e11 center / cover no-repeat; }
    .wall video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wall .mirror { transform: scaleX(-1); }   /* flips the poster and the video together */
    @keyframes drift {
      0%   { transform: scale(1.06) translate(-2.2%, -1.6%); }
      50%  { transform: scale(1.18) translate(1.6%, -2.4%); }
      100% { transform: scale(1.12) translate(2.4%, 2.2%); }
    }
    /* keeps the card readable over moving video, without any blur */
    .shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(10, 11, 14, .55) 0%, rgba(10, 11, 14, .78) 65%, rgba(10, 11, 14, .92) 100%); }

    /* ---- the card ---------------------------------------------------------------- */
    main { position: relative; z-index: 2; width: min(460px, calc(100vw - 32px)); transition: opacity .25s ease; }
    html.checking main { opacity: 0; }
    /* while go.fridge.run is asked "signed in?" - a moment at most */
    .wait { position: fixed; inset: 0; z-index: 3; display: none; place-items: center; pointer-events: none; }
    html.checking .wait { display: grid; }
    .wait img { width: 64px; height: 64px; border-radius: 16px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .6; } }
    .panel { --place: var(--mint); text-align: center; padding: 30px 28px 24px; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 14px; }
    .brand img { width: 56px; height: 56px; border-radius: 14px; }
    .brand b { font-size: 26px; letter-spacing: -.02em; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .tag { color: var(--ink-2); margin: 0 0 18px; }
    .signin { display: block; margin: 0 auto 10px; width: min(300px, 100%); line-height: 0; border-radius: 14px; transition: transform .12s ease; }
    .signin img { width: 100%; height: auto; border-radius: 14px; }
    .signin:hover { transform: translateY(-2px); }
    .signin:focus-visible { outline: none; box-shadow: var(--focus); }
    .redeem { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--paper-3); text-align: left; }
    .redeem label { display: flex; align-items: center; gap: 9px; font-weight: 800; margin: 0 0 10px; }
    .redeem .ico { width: 30px; height: 30px; font-size: 16px; }
    .redeem-row { display: flex; gap: 8px; }
    .redeem input { flex: 1; min-width: 0; font: 700 14.5px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .04em; text-transform: uppercase;
      padding: 11px 12px; border-radius: 11px; border: 1px solid #bcc1ca; background: #fff; color: var(--ink); }
    .redeem input::placeholder { text-transform: none; color: #8a8e98; letter-spacing: .02em; }
    .redeem input:focus { outline: none; border-color: var(--mint); box-shadow: var(--focus); }
    .redeem small { display: block; margin-top: 8px; color: var(--dim); font-size: 12.5px; }
    /* "PHP patched" prize ribbon (2026-10-22 PHP CVE response): blue rosette, pulsing */
    .ribbon { display: block; width: min(210px, 48vw); height: auto; margin: 0 auto -6px; overflow: visible;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .55)); transform-origin: 50% 40%; animation: ribbon 1.8s ease-in-out infinite; }
    @keyframes ribbon { 0%, 100% { transform: scale(.9); } 50% { transform: scale(1.08); } }
    .ribbon text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 900; text-anchor: middle; fill: #fff; }

  <script>
  (function () {
    'use strict';
    var root = document.documentElement;

    // ---- 1. Signed in already? Straight to your panel, before the wall starts.
    // go.fridge.run answers only yes/no, and only to this site. ?stay shows the
    // homepage anyway.
    var stay = /[?&]stay\b/.test(location.search);
    function show() { root.classList.remove('checking'); }
    function check(then) {
      if (stay || !window.fetch) { then(); return; }
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; then(); } }, 1200);
      fetch('https://go.fridge.run/api/me', { credentials: 'include', cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (done) return;
          done = true; clearTimeout(timer);
          if (j && j.signedIn) { location.replace('https://go.fridge.run/'); } else { then(); }
        })
        .catch(function () { if (!done) { done = true; clearTimeout(timer); then(); } });
    }

    // ---- 2. The wall ---------------------------------------------------------------
    // Three clips (Sora originals - the only ones there are), each shown three
    // times. Placed so a clip never sits next to itself, and varied per tile by
    // start point, speed and mirror-flip, so repeats do not read as repeats.
    var CLIPS = ['./media/wall/IMG_8065', './media/wall/IMG_8066', './media/wall/IMG_8067'];
    var SPEEDS = [0.82, 0.94, 1.06];
    function buildWall() {
      var wall = document.getElementById('wall');
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches || (navigator.connection || {}).saveData === true;
      var videos = [];
      for (var r = 0; r < 3; r++) {
        for (var c = 0; c < 3; c++) {
          var i = r * 3 + c;
          var clip = CLIPS[(r + c) % 3];                   // Latin square: no clip beside itself
          var tile = document.createElement('div');
          tile.className = 'tile' + ((r * 2 + c) % 3 === 1 ? ' mirror' : '');
          tile.style.backgroundImage = 'url("' + clip + '.jpg")';   // shown until (or instead of) the video
          if (!still) {
            var v = document.createElement('video');
            v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = false;
            v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
            v.preload = 'auto';
            v.poster = clip + '.jpg';
            v.src = clip + '.mp4';
            v.dataset.offset = String((i * 3.3) % 9);
            v.dataset.rate = String(SPEEDS[(r + 2 * c) % 3]);
            v.addEventListener('loadedmetadata', function () {
              var d = this.duration;
              if (isFinite(d) && d > 1) { this.currentTime = parseFloat(this.dataset.offset) % (d - 0.5); }
              this.playbackRate = parseFloat(this.dataset.rate);
            });
            tile.appendChild(v);
            videos.push(v);
          }
          wall.appendChild(tile);
        }
      }
      // Start them a beat apart - starting nine decoders in one frame hitches.
      // Phones in low-power or data-saver mode refuse silent autoplay: then the
      // stills stay up and the wall starts on the first tap or scroll instead.
      var blocked = false;
      function start(v) { var p = v.play(); if (p && p.catch) p.catch(function () { blocked = true; }); }
      videos.forEach(function (v, k) { setTimeout(function () { start(v); }, 120 * k); });
      function wake() {
        if (!blocked) return;
        blocked = false;
        videos.forEach(start);
      }
      ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(function (ev) { window.addEventListener(ev, wake, { passive: true }); });
      // Nobody is watching a hidden tab: stop decoding.
      document.addEventListener('visibilitychange', function () {
        videos.forEach(function (v) { if (document.hidden) { v.pause(); } else { var p = v.play(); if (p && p.catch) p.catch(function () {}); } });
      });
    }

    check(function () { show(); buildWall(); });
  })();
  </script>
