<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fridge is down · fridge.run</title>
  <meta name="description" content="fridge.run is temporarily unavailable.">
  <meta name="theme-color" content="#101216">
  <link rel="icon" href="./logo.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101216;
      --panel: #1a1d24;
      --ink: #f5f7fa;
      --muted: #aeb5c1;
      --accent: #ff6b6b;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 107, 107, .1), transparent 36rem),
        var(--bg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(32px, 8vw, 64px) clamp(24px, 7vw, 56px);
      text-align: center;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid #303641;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    .status-mark {
      width: 112px;
      height: 112px;
      margin: 0 auto 28px;
      color: var(--accent);
    }

    .status-mark circle,
    .status-mark path {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .status-mark circle { stroke-width: 5; }
    .status-mark path { stroke-width: 7; }

    .brand {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 4rem);
      letter-spacing: -.05em;
      line-height: 1;
    }

    .message {
      max-width: 30rem;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .message strong { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <svg class="status-mark" viewBox="0 0 112 112" role="img" aria-label="Unavailable">
      <circle cx="56" cy="56" r="45"></circle>
      <path d="M37 37l38 38M75 37L37 75"></path>
    </svg>
    <p class="brand">fridge.run</p>
    <h1>fridge is down</h1>
    <p class="message">
      Sorry — <strong>go.fridge.run</strong> is not accessible right now.
      We’re working on it and hope to have things chilled again soon.
    </p>
  </main>
</body>
</html>
