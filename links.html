<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fridge.run Access Portal</title>
  <meta name="theme-color" content="#050505">
  <link rel="stylesheet" href="/fridge-share-shell.css">
</head>
<body>
  <main class="shell">
    <div class="stack">
      <div>
        <p class="eyebrow">Fridge.run</p>
        <h1>Access Portal</h1>
      </div>

      <nav class="grid" aria-label="Primary links">
        <a class="card-link" href="/share/">
          <span class="card-title">Share Lookup</span>
          <span class="card-copy">Open a short hash.</span>
        </a>
        <a class="card-link" href="/shares/">
          <span class="card-title">Recent Shares</span>
          <span class="card-copy">Saved local and mirrored history.</span>
        </a>
        <a class="card-link" href="/redirect/">
          <span class="card-title">Redirect</span>
          <span class="card-copy">Preview the direct handoff.</span>
        </a>
        <a class="card-link" href="/docs/">
          <span class="card-title">Docs</span>
          <span class="card-copy">Bridge and tunnel notes.</span>
        </a>
        <a class="card-link" href="/status/">
          <span class="card-title">Status</span>
          <span class="card-copy">Bridge and share-origin health.</span>
        </a>
        <a class="card-link" href="/login/">
          <span class="card-title">Login</span>
          <span class="card-copy">Reserved auth surface.</span>
        </a>
      </nav>

      <section class="panel" id="recentPanel" hidden>
        <div class="action-row" style="margin-bottom:14px">
          <button class="button" id="clearRecent" type="button">Clear local history</button>
        </div>
        <div class="share-list" id="recentList"></div>
        <div class="share-empty" id="emptyState" hidden>No recent shares are stored yet.</div>
      </section>
    </div>
  </main>

  <script src="/fridge-share-config.js"></script>
  <script src="/fridge-share-bridge.js"></script>
  <script>
    (() => {
      const bridge = window.FridgeShareBridge;
      const bridgeOrigin = bridge.detectBridgeOrigin();
      const recentPanel = document.getElementById('recentPanel');
      const recentList = document.getElementById('recentList');
      const emptyState = document.getElementById('emptyState');
      const clearRecent = document.getElementById('clearRecent');

      const render = () => {
        const entries = bridge
          .loadRecentShares()
          .map((entry) => bridge.normalizeRecentEntry(entry, { bridgeOrigin }))
          .filter(Boolean);

        if (!entries.length) {
          recentPanel.hidden = true;
          recentList.textContent = '';
          emptyState.hidden = false;
          return;
        }

        recentPanel.hidden = false;
        bridge.renderRecentShares(recentList, entries, {
          emptyState,
          onDeleteLocal: (entry) => {
            bridge.deleteRecentShare(entry.shareId);
            render();
          }
        });
      };

      clearRecent.addEventListener('click', () => {
        bridge.saveRecentShares([]);
        render();
      });

      render();
    })();
  </script>
</body>
</html>
