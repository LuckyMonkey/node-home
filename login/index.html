<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fridge.run — Sign in</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#020202">
  <link rel="icon" href="../logo.png">
  <!-- Sign-in moved to the panel, which performs the OpenID Connect exchange
       SERVER-SIDE. This page used to run the flow in the browser with PKCE; that
       worked, but it could only ever prove who you are - it could not gate
       anything, because this site is static. The panel can do both, so there is
       no reason to keep a second authentication implementation alive here.
       This page stays only so older links still land somewhere sensible. -->
  <meta http-equiv="refresh" content="0; url=https://go.fridge.run/">
  <link rel="canonical" href="https://go.fridge.run/">
  <link rel="stylesheet" href="../fridge-shell.css">
  <style>
    body { display: grid; place-items: center; padding: 20px 16px; }
    .box { width: min(420px, 100%); text-align: center; --place: var(--mint); }
    .box h1 { font-size: 22px; margin: 0 0 8px; }
    .box p { color: var(--ink-2); margin: 0 0 14px; }
  </style>
</head>
<body>
  <main class="box panel">
    <h1>Taking you to your panel…</h1>
    <p><a class="btn primary" href="https://go.fridge.run/">Continue</a></p>
  </main>
  <script>location.replace('https://go.fridge.run/');</script>
</body>
</html>
