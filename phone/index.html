<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open on your phone — fridge.run</title>
  <meta name="description" content="Scan a QR code to open a link on your phone, or have it texted to you.">
  <meta name="theme-color" content="#0e0f12">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/fridge-shell.css">
  <style>
    body { padding: 22px 16px 60px; }
    main { width: min(560px, 100%); margin: 0 auto; }
    .panel { --place: var(--c-status); text-align: center; }
    h1 { font-size: 22px; margin: 0 0 4px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .qr { width: min(300px, 100%); margin: 16px auto 10px; padding: 12px; background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); }
    .qr svg { display: block; width: 100%; height: auto; }
    .url { font: 13px ui-monospace, Menlo, monospace; word-break: break-all; color: var(--ink-2); margin: 0 0 16px; }
    form { display: flex; gap: 8px; margin: 0 0 6px; }
    input { flex: 1; min-width: 0; font: 14px ui-monospace, Menlo, monospace; padding: 11px 12px; border-radius: 11px; border: 1px solid #bcc1ca; background: #fff; color: var(--ink); }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--paper-3); }
    .hint { font-size: 13px; color: var(--dim); margin: 10px 0 0; }
  </style>
</head>
<body>
  <main>
    <header class="bar"><a class="brand" href="/"><img src="/logo.png" alt=""><span>fridge.run</span></a><a class="back-btn" href="/"><picture><source type="image/webp" srcset="/media/back-button.webp 1x, /media/back-button@2x.webp 2x"><img src="/media/back-button.png" srcset="/media/back-button@2x.png 2x" width="200" height="55" alt="Back to fridge.run"></picture></a></header>
    <section class="panel">
      <h1><span class="ico" aria-hidden="true">📱</span>Open on your phone</h1>
      <div class="qr" id="qr" role="img" aria-label="QR code"></div>
      <p class="url" id="shown"></p>
      <form id="pick" action="/phone/" method="get">
        <input id="url" name="url" type="url" required spellcheck="false" aria-label="Link">
        <button class="btn" type="submit">Show</button>
      </form>
      <div class="row">
        <a class="btn primary" id="text" href="https://go.fridge.run/phone">💬 Text it to me</a>
      </div>
      <p class="hint">Scan with your phone's camera. Texting needs a fridge.run sign-in.</p>
    </section>
  </main>
  <script src="/media/qrcode.js"></script>
  <script>
    (function () {
      function ok(u) { try { var x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') && u.length <= 600 ? u : ''; } catch (e) { return ''; } }
      var q = new URLSearchParams(location.search).get('url');
      var ref = document.referrer && new URL(document.referrer).pathname !== '/phone/' ? document.referrer : '';
      var url = ok(q || '') || ok(ref) || 'https://fridge.run/';
      document.getElementById('url').value = url;
      document.getElementById('shown').textContent = url;
      document.getElementById('text').href = 'https://go.fridge.run/phone?url=' + encodeURIComponent(url);
      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
      var c = qrcode(0, 'M'); c.addData(url); c.make();
      document.getElementById('qr').innerHTML = c.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
    })();
  </script>
</body>
</html>
